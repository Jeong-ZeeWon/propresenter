<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProPresenter 6 파일 생성기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>ProPresenter 6 파일 생성기</h1>
    <p class="subtitle">텍스트를 입력하면 ProPresenter 6용 <code>.pro6</code> 파일을 만들어줍니다.</p>

    <div class="field">
      <label for="text-input">텍스트</label>
      <textarea id="text-input" rows="14" placeholder="여기에 텍스트를 입력하세요.

예시)
#1절
주 하나님 지으신 모든 세계
내 마음 속에 그리어 볼 때

#후렴
주님의 위대하심을
내 영혼이 찬양하네"></textarea>
      <p class="hint">
        빈 줄로 슬라이드(또는 줄 단위 모드에서는 한 줄)를 구분합니다.<br />
        <code>#그룹이름</code> 으로 시작하는 줄은 이후 슬라이드들의 그룹(예: 절/후렴) 이름이 됩니다.
      </p>
    </div>

    <div class="options">
      <div class="field">
        <label for="split-mode">슬라이드 구분 방식</label>
        <select id="split-mode">
          <option value="paragraph" selected>빈 줄로 구분 (문단 = 슬라이드)</option>
          <option value="line">한 줄 = 한 슬라이드</option>
        </select>
      </div>

      <div class="field">
        <label for="file-name">파일 이름</label>
        <input type="text" id="file-name" value="presentation" />
      </div>

      <div class="field">
        <label for="aspect-ratio">화면 비율</label>
        <select id="aspect-ratio">
          <option value="1280x720" selected>16:9 (1280 x 720)</option>
          <option value="1024x768">4:3 (1024 x 768)</option>
        </select>
      </div>

      <div class="field">
        <label for="font-family">글꼴</label>
        <input type="text" id="font-family" value="Apple SD Gothic Neo" />
      </div>

      <div class="field">
        <label for="font-size">글자 크기 (pt)</label>
        <input type="number" id="font-size" value="60" min="8" max="300" />
      </div>

      <div class="field">
        <label for="text-align">정렬</label>
        <select id="text-align">
          <option value="center" selected>가운데</option>
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
      </div>

      <div class="field">
        <label for="text-color">글자 색상</label>
        <input type="color" id="text-color" value="#ffffff" />
      </div>

      <div class="field">
        <label for="bg-color">배경 색상</label>
        <input type="color" id="bg-color" value="#000000" />
      </div>
    </div>

    <div class="actions">
      <button id="generate-btn">.pro6 파일 생성 및 다운로드</button>
      <span id="status"></span>
    </div>

    <div class="preview">
      <h2>미리보기</h2>
      <div id="preview-output"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
